<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サークルとのつながり — 東大生の遊び場+α</title>
  <meta name="description" content="東大生の遊び場+α(プラスアルファ)のメンバーが所属しているサークルの紹介。ここから一緒に面白いことを企画できるかもしれません。">
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
</head>
<body class="pg-circles">
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../index.html">東大生の遊び場<img class="brand-logo" src="../images/logo.png" alt="+α"></a>
      <nav class="site-nav">
        <a href="../index.html">トップ</a>
        <a href="../events/index.html">イベント</a>
        <a href="../about/index.html">About</a>
        <a href="index.html" aria-current="page">サークル</a>
        <a href="../contact/index.html">お問い合わせ</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-title">
      <div class="container">
        <p class="kicker">NETWORK</p>
        <h1>サークルとのつながり</h1>
        <p class="lead">メンバーが所属しているサークルたち</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="prose">
          <p>いろんなサークル・団体のメンバーが個人として +α に参加していて、企画によっては自分のサークルを巻き込める — そんな「つながり」の一覧です。</p>
          <p id="circle-count"></p>
        </div>
        <ul class="circle-grid" id="circle-list"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <img class="footer-logo" src="../images/logo.png" alt="+α">
      <nav class="footer-nav">
        <a href="../index.html">トップ</a>
        <a href="../events/index.html">イベント</a>
        <a href="../about/index.html">About</a>
        <a href="index.html">サークル</a>
        <a href="../contact/index.html">お問い合わせ</a>
      </nav>
      <div class="footer-sns">
        <a href="https://x.com/ut_plusalpha" target="_blank" rel="noopener">X: @ut_plusalpha</a>
        <a href="https://www.instagram.com/ut_plusalpha/" target="_blank" rel="noopener">Instagram: @ut_plusalpha</a>
      </div>
      &copy; 2026 東大生の遊び場+α
    </div>
  </footer>

  <script src="../circles-data.js"></script>
  <script>
    // 掲載の承諾を得た(approved: true)ものだけ表示する
    const approvedCircles = CIRCLES.filter((circle) => circle.approved);

    document.getElementById("circle-count").textContent =
      "現在 " + approvedCircles.length + " のサークル・団体とつながっています。";

    const list = document.getElementById("circle-list");
    for (const circle of approvedCircles) {
      const li = document.createElement("li");
      li.className = "circle-card";

      // link があればカード全体をリンクにする。なければただの div
      const inner = document.createElement(circle.link ? "a" : "div");
      inner.className = "circle-card-inner";
      if (circle.link) {
        inner.href = circle.link;
        inner.target = "_blank";
        inner.rel = "noopener";
      }

      if (circle.photo) {
        const photoWrap = document.createElement("div");
        photoWrap.className = "circle-card-photo";
        const photoImg = document.createElement("img");
        photoImg.src = circle.photo;
        photoImg.alt = "";
        photoWrap.appendChild(photoImg);
        inner.appendChild(photoWrap);
      }

      const body = document.createElement("div");
      body.className = "circle-card-body";

      const header = document.createElement("div");
      header.className = "circle-card-header";

      if (circle.logo) {
        const logoImg = document.createElement("img");
        logoImg.className = "circle-card-logo";
        logoImg.src = circle.logo;
        logoImg.alt = "";
        header.appendChild(logoImg);
      }

      const name = document.createElement("h3");
      name.textContent = circle.name;
      header.appendChild(name);
      body.appendChild(header);

      if (circle.description) {
        const desc = document.createElement("p");
        desc.textContent = circle.description;
        body.appendChild(desc);
      }

      inner.appendChild(body);
      li.appendChild(inner);
      list.appendChild(li);
    }
  </script>
</body>
</html>
