<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サークルとのつながり — 東大生の遊び場+α</title>
  <meta name="description" content="東大生の遊び場+α(プラスアルファ)のメンバーが所属しているサークルの紹介。ここから一緒に面白いことを企画できるかもしれません。">
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../index.html">東大生の遊び場<img class="brand-logo" src="../images/logo.png" alt="+α"></a>
      <nav class="site-nav">
        <a href="../index.html">トップ</a>
        <a href="../about/index.html">About</a>
        <a href="index.html" aria-current="page">サークル</a>
        <a href="../contact/index.html">お問い合わせ</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-title">
      <div class="container">
        <p class="kicker">NETWORK</p>
        <h1>サークルとのつながり</h1>
        <p class="lead">メンバーが所属しているサークルたち</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="prose">
          <p>+α にサークルが加盟しているわけではありません。いろんなサークルのメンバーが個人として +α に参加していて、企画によっては自分のサークルを巻き込める — そんな「つながり」の一覧です。</p>
        </div>
        <div class="card-grid" id="circle-list" style="margin-top: 32px;"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <img class="footer-logo" src="../images/logo.png" alt="+α">
      <nav class="footer-nav">
        <a href="../index.html">トップ</a>
        <a href="../about/index.html">About</a>
        <a href="index.html">サークル</a>
        <a href="../contact/index.html">お問い合わせ</a>
      </nav>
      &copy; 2026 東大生の遊び場+α
    </div>
  </footer>

  <script src="../circles-data.js"></script>
  <script>
    const list = document.getElementById("circle-list");
    for (const circle of CIRCLES) {
      const card = document.createElement("article");
      card.className = "card";

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = circle.category;

      const heading = document.createElement("h3");
      if (circle.url) {
        const link = document.createElement("a");
        link.href = circle.url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = circle.name;
        heading.appendChild(link);
      } else {
        heading.textContent = circle.name;
      }

      const desc = document.createElement("p");
      desc.textContent = circle.description;

      card.append(tag, heading, desc);
      list.appendChild(card);
    }
  </script>
</body>
</html>
