<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東大生の遊び場+α</title>
  <meta name="description" content="東大生の遊び場+α(プラスアルファ)は、いろんなサークルの代表が集まるコミュニティ。交流会からサッカー観戦、AI実験イベントまで、面白そうなことをなんでもやっています。">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">東大生の遊び場<img class="brand-logo" src="images/logo.png" alt="+α"></a>
      <nav class="site-nav">
        <a href="index.html" aria-current="page">トップ</a>
        <a href="about/index.html">About</a>
        <a href="circles/index.html">参加サークル</a>
        <a href="contact/index.html">お問い合わせ</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <img class="hero-bg" src="images/event-0607-second.jpg" alt="交流会に集まったメンバーの集合写真">
      <div class="hero-content">
        <h1>サークルの垣根を越えた、<br>東大生の遊び場。</h1>
      </div>
    </section>

    <section class="section" id="events">
      <div class="container">
        <h2>イベント情報</h2>
        <div id="event-list"></div>
      </div>
    </section>

    <section class="section" id="activities">
      <div class="container">
        <h2>今までの活動</h2>
        <div class="photo-grid" id="activity-list"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2>+α とは</h2>
        <div class="prose">
          <p>ひとつのサークルだけでは実現が難しいイベントや企画も、サークル同士が手を組めば実現できる。+α は、そんな「サークルの横のつながり」から面白いことを生み出していくコミュニティです。</p>
          <p><a href="about/index.html">詳しく見る →</a></p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2>参加したい方へ</h2>
        <div class="prose">
          <p>+α への参加に興味のあるサークル・個人の方は、お気軽にお問い合わせください。</p>
          <p><a href="contact/index.html">お問い合わせはこちら →</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <img class="footer-logo" src="images/logo.png" alt="+α">
      &copy; 2026 東大生の遊び場+α
    </div>
  </footer>

  <script src="events-data.js"></script>
  <script>
    // イベント情報(UPCOMING_EVENTS)の描画
    const eventList = document.getElementById("event-list");
    if (UPCOMING_EVENTS.length === 0) {
      const empty = document.createElement("p");
      empty.textContent = "現在告知中のイベントはありません。次の企画をお楽しみに!";
      eventList.appendChild(empty);
    }
    for (const event of UPCOMING_EVENTS) {
      const card = document.createElement("article");
      card.className = "event-card";

      const badge = document.createElement("span");
      badge.className = "tag";
      badge.textContent = event.badge;
      card.appendChild(badge);

      const heading = document.createElement("h3");
      heading.textContent = event.title;
      card.appendChild(heading);

      const body = document.createElement("div");
      body.className = "event-body";

      const flyerGrid = document.createElement("div");
      flyerGrid.className = "flyer-grid";
      for (const flyer of event.flyers) {
        const link = document.createElement("a");
        link.href = flyer.src;
        link.target = "_blank";
        link.rel = "noopener";
        const img = document.createElement("img");
        img.src = flyer.src;
        img.alt = flyer.alt;
        img.loading = "lazy";
        link.appendChild(img);
        flyerGrid.appendChild(link);
      }
      body.appendChild(flyerGrid);

      const prose = document.createElement("div");
      prose.className = "prose";

      const desc = document.createElement("p");
      desc.textContent = event.description;
      prose.appendChild(desc);

      const dl = document.createElement("dl");
      for (const [label, value] of event.details) {
        const dt = document.createElement("dt");
        dt.textContent = label;
        const dd = document.createElement("dd");
        dd.textContent = value;
        dl.append(dt, dd);
      }
      prose.appendChild(dl);

      if (event.note) {
        const note = document.createElement("p");
        note.className = "event-note";
        note.textContent = event.note;
        prose.appendChild(note);
      }

      body.appendChild(prose);
      card.appendChild(body);
      eventList.appendChild(card);
    }

    // 今までの活動(PAST_ACTIVITIES)の描画
    const activityList = document.getElementById("activity-list");
    for (const activity of PAST_ACTIVITIES) {
      const figure = document.createElement("figure");
      figure.className = "polaroid";

      const img = document.createElement("img");
      img.src = activity.src;
      img.alt = activity.alt;
      img.loading = "lazy";

      const caption = document.createElement("figcaption");
      const date = document.createElement("span");
      date.className = "date";
      date.textContent = activity.date;
      caption.append(date, activity.title);

      figure.append(img, caption);
      activityList.appendChild(figure);
    }
  </script>
</body>
</html>
